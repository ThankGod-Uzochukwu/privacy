<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src file:"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        cursor: move;
      }
      /* Dragging the whole cover moves the window (Electron app-region). */
      #cover {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 1);
        -webkit-app-region: drag;
      }
      #grip {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 22px;
        height: 22px;
        cursor: nwse-resize;
        -webkit-app-region: no-drag;
        background: linear-gradient(135deg, transparent 50%, rgba(124, 108, 255, 0.9) 50%);
        border-bottom-right-radius: 2px;
      }
      .locked #grip {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="cover"><div id="grip"></div></div>
    <script src="mask.js"></script>
  </body>
</html>
